:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface-2:#F0ECE4; --ink:#22211E; --ink-2:#6A645A; --ink-3:#958E82; --line:#E8E2D7;
  --ghost:#B9B1A4;
  --brand:#C9441A; --brand-2:#E8602F; --brand-soft:#FBE6DB; --on-brand:#FFFFFF;
  --ok:#1F8A60; --ok-soft:#DDEFE5; --on-ok:#FFFFFF;
  --gold:#9A7300; --gold-soft:#F8EDC6;
  --bad:#B3261E; --bad-soft:#FBE0DC;
  --toast-act:#FFB08F;
  --shadow:0 1px 2px rgba(64,58,46,.05),0 10px 28px -14px rgba(64,58,46,.22);
  --f-ui:"Rubik",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"Rubik",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191816; --surface:#242321; --surface-2:#302E2A; --ink:#EEEAE3; --ink-2:#ABA59A; --ink-3:#7E786E; --line:#3A3731;
  --ghost:#68625A;
  --brand:#FF8A5C; --brand-2:#F47443; --brand-soft:#3D2318; --on-brand:#2A0E03;
  --ok:#56CF9A; --ok-soft:#1D3A2D; --on-ok:#06281A;
  --gold:#F2C94C; --gold-soft:#3A2F10;
  --bad:#FF8A7D; --bad-soft:#3D1D1A;
  --toast-act:#C9441A;
  --shadow:0 0 0 1px var(--line); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;letter-spacing:-.1px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:10px}
svg{flex:none}
.num{font-family:var(--f-num);font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.5}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 16px 4px}
.top-in{max-width:560px;margin:0 auto}
.whead{display:flex;align-items:flex-end;gap:12px}
.wt{flex:1;min-width:0}
.wt small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.wt b{display:block;font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.wcount{text-align:left;flex:none}
.wcount .nums{display:flex;align-items:baseline;direction:ltr;justify-content:flex-start}
.wcount #cnt{font-size:32px;line-height:1;display:inline-block}
.wcount .of{font-size:16px;font-weight:600;color:var(--ink-3)}
.wcount small{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.segs{display:grid;gap:4px;margin-top:8px}
.seg-i{display:block;padding:8px 0}
.seg-i span{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.seg-i i{display:block;height:100%;border-radius:6px;background:var(--brand-2);transition:width .45s var(--ease),background .3s}
.seg-i.full i{background:var(--ok)}
.pagehead h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.segc{display:flex;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;margin:12px 0 8px}
.segc button{flex:1;padding:9px 6px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:center}
.segc button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:560px;margin:0 auto;padding:10px 16px calc(112px + env(safe-area-inset-bottom))}

/* ---------- notices ---------- */
.notice{display:flex;gap:10px;align-items:center;border-radius:18px;padding:12px 14px;margin:0 0 12px;font-size:14px;font-weight:500;line-height:1.4}
.notice svg{width:18px;height:18px}
.notice span{flex:1}
.notice.info{background:var(--brand-soft);color:var(--brand)}
.notice.soft{border:1.5px dashed var(--line);color:var(--ink-2)}
.notice.soft b{color:var(--ink);font-weight:600}
.prevline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin:0 4px 12px}
.prevline svg{width:16px;height:16px;color:var(--ink-3)}
.prevline b{color:var(--ink);font-weight:600}

/* ---------- exercise card ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;scroll-margin-top:132px;transition:box-shadow .3s,border-color .3s}
.ex.now{border-color:transparent;box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.exh{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px 12px}
.exn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none;transition:background .3s,color .3s}
.exn .num{font-size:15px;letter-spacing:0}
.exn svg{width:17px;height:17px;display:none}
.ex.now .exn{background:var(--brand);color:var(--on-brand)}
.ex.comp .exn{background:var(--ok);color:var(--on-ok)}
.ex.comp .exn .num{display:none}
.ex.comp .exn svg{display:block}
.ext{flex:1;min-width:0}
.ext b{display:block;font-size:17.5px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.ext small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.exst{display:flex;align-items:center;gap:6px;flex:none}
.chev{color:var(--ink-3);display:flex;transition:transform .3s var(--ease)}
.chev svg{width:18px;height:18px}
.ex:not(.col) .chev{transform:rotate(180deg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.now{background:var(--brand-soft);color:var(--brand)}
.tag.cnt{background:var(--surface-2);color:var(--ink-2);direction:ltr}
.tag.cnt b{color:var(--ink)}
.tag.pr{background:var(--gold-soft);color:var(--gold)}
.exb,.exs{display:grid;grid-template-rows:1fr;transition:grid-template-rows .34s var(--ease)}
.exs{grid-template-rows:0fr}
.ex.col .exb{grid-template-rows:0fr}
.ex.col .exs{grid-template-rows:1fr}
.clip{overflow:hidden;min-height:0}
.sumline{margin:0;padding:0 62px 14px 16px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.sumline .ltr{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{font-style:normal;color:var(--ink-3);margin:0 7px}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip svg{width:14px;height:14px}
.chip b{color:var(--ink);font-weight:700}
.chip.up{background:var(--ok-soft);color:var(--ok)}
.sets{padding:6px 16px 8px}
.set{display:grid;grid-template-columns:36px minmax(0,1fr) 12px minmax(0,1fr) 46px;align-items:center;gap:8px;padding:5px 0}
.set.bw{grid-template-columns:36px minmax(0,1fr) 46px}
.set.sh{padding:0;font-size:12px;color:var(--ink-3);font-weight:500}
.set.sh span{text-align:center}
.set.sh i{font-style:normal;opacity:.75}
.sb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);position:relative;transition:background .25s}
.sb .num{font-size:15px;letter-spacing:0}
.sb svg{width:17px;height:17px;display:none}
.sb::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--ok);opacity:0;pointer-events:none}
.set.done .sb{background:var(--ok);color:var(--on-ok);box-shadow:none}
.set.done .sb .num{display:none}
.set.done .sb svg{display:block}
.in{width:100%;height:52px;border-radius:14px;border:1.5px solid transparent;background:var(--surface-2);text-align:center;font-family:var(--f-num);font-weight:700;font-size:22px;letter-spacing:-.3px;font-variant-numeric:tabular-nums;outline:none;padding:0 4px;direction:ltr;transition:background .2s,border-color .2s;-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--ghost);font-weight:600;opacity:1}
.in:focus{border-color:var(--brand);background:var(--surface)}
.set.done .in{background:var(--ok-soft)}
.set.done .in:focus{background:var(--surface)}
.x{text-align:center;color:var(--ink-3);font-weight:600}
.dl{display:flex;justify-content:center;line-height:1.1}
.dl span{display:flex;flex-direction:column;align-items:center}
.dl b{font-size:14.5px;font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.dl i{font-style:normal;font-size:10.5px;font-weight:500}
.dl .up{color:var(--ok)} .dl .dn{color:var(--bad)} .dl .eq{color:var(--ink-3)}
.prevd{margin:0;padding:0 16px 14px;font-size:12px;color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:14px;font-size:14.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;height:50px;font-size:16px}
.btn.line{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad-soft)}
.finish{margin-top:6px;height:56px!important;font-size:17px!important;border-radius:18px;transition:opacity .3s}
.finish.off{opacity:.4;pointer-events:none}

/* ---------- history ---------- */
.hcard,.pcard{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;text-align:right}
.hcard:active,.pcard:active{background:var(--surface-2)}
.hcard .t{display:flex;align-items:center;gap:8px}
.hcard .t b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.hcard .t small{flex:1;font-size:13px;color:var(--ink-2)}

/* ---------- motion ---------- */

  .top-in.enter{animation:fade .35s ease both}

@keyframes medal{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:none}}

@media (prefers-reduced-motion:no-preference){
  main.enter .cal{animation:up .5s var(--ease) both}
  main.enter .startbox{animation:up .5s var(--ease) .12s both}

  main.enter .cd.today{animation:todayIn .9s var(--ease) .25s both}
  main.anim-next{animation:mNext .28s var(--ease)}

}

<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="view"></main>
<nav class="tabs"><div class="in2" id="nav"></div></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="confetti.js" defer></script>
<script>
"use strict";
{
const VERSION='1.1';

/* =========================================================
   התוכנית — לשנות כאן תרגילים / סדר / יעדים.
   id קבוע: אסור לשנות id של תרגיל קיים, אחרת ההיסטוריה שלו תתנתק.
   rest בשניות. reps:null = מקסימום. bw:true = בלי משקל.
   bar = משקל המוט; ברשומה מזינים משקל לצד אחד, והסה״כ = מוט + 2 × צד.
   ========================================================= */
const PROGRAM=[
  {id:'bench',    n:'לחיצת חזה חופשי',                      sets:3, reps:8,  rest:90},
  {id:'pulldown', n:'פולי עליון',       sub:'אחיזה ניטרלית', sets:3, reps:6,  rest:120},
  {id:'legext',   n:'פשיטת רגליים',                         sets:3, reps:10, rest:75},
  {id:'legcurl',  n:'כפיפת רגליים',                         sets:3, reps:10, rest:75},
  {id:'latraise', n:'הרחקת כתפיים',                         sets:3, reps:15, rest:50},
  {id:'curl',     n:'דו־ראשי',          sub:'מוט אולימפי',   sets:3, reps:8,  rest:90, bar:20},
  {id:'skull',    n:'לחיצה צרפתית',                         sets:3, reps:8,  rest:90, bar:7.5},
  {id:'calf',     n:'תאומים בישיבה',                        sets:3, reps:12, rest:75},
  {id:'absm',     n:'בטן במכונה',                           sets:3, reps:20, rest:null},
];
// תרגילים שיצאו מהתוכנית — נשארים בהיסטוריה
const RETIRED=[
  {id:'abs', n:'בטן', sub:'בוסו', sets:3, reps:null, rest:null, bw:true, retired:true},
];
const ALL=[...PROGRAM,...RETIRED];
const EX=Object.fromEntries(ALL.map(e=>[e.id,e]));

/* ---------- עזרים ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const dm=s=>{const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)};
const wday=s=>pd(s).toLocaleDateString('he-IL',{weekday:'long'});
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const rel=s=>{const n=dayDiff(s,today());return n<=0?'היום':n===1?'אתמול':n===2?'שלשום':`לפני ${n} ימים`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'':String(+(+n).toFixed(2));
const restTxt=s=>s<60?`${s} שנ׳`:`${Math.floor(s/60)}:${pad(s%60)} דק׳`;
const durTxt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`};
const haptic=p=>{try{navigator.vibrate&&navigator.vibrate(p||8)}catch(e){}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const has=v=>v!=null;
const tw=(e,w)=>w==null?null:(e.bar!=null?e.bar+2*w:w);   // משקל כולל
const wT=(e,w)=>has(w)?fmt(tw(e,w)):'–';

/* ---------- אחסון ---------- */
const KEY='gymTracker.v1';
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
let S=load()||{v:2,created:Date.now(),lastExport:null,sessions:{}};
if(!S.sessions)S.sessions={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
if(storageOK&&navigator.storage&&navigator.storage.persist&&location.protocol.startsWith('http'))navigator.storage.persist().catch(()=>{});

// v1 → v2: בדו־ראשי ובצרפתית עוברים לרישום "משקל לצד"
function migrate(){
  if((S.v||1)>=2)return;
  const notes=[];
  for(const [d,s] of Object.entries(S.sessions)){
    for(const id of ['curl','skull']){
      const e=EX[id],a=s.ex&&s.ex[id];if(!a)continue;const seen=new Map();
      for(const st of a){if(!st||!has(st.w))continue;const was=st.w;
        if(was>=e.bar)st.w=Math.round((was-e.bar)/2*4)/4;
        seen.set(was+'|'+st.w,[was,st.w])}
      if(seen.size)notes.push({d,id,vals:[...seen.values()]});
    }
    if(s.done&&!s.end)s.end=s.t1;
  }
  S.v=2;if(notes.length)S.migNote=notes;save();
}

/* ---------- נתונים ---------- */
const filledD=x=>!!x&&(has(x.w)||has(x.r));
const isDone=(s,e)=>!!s&&has(s.r)&&(e.bw||has(s.w));
const anyV=s=>!!s&&(has(s.w)||has(s.r)||(s.d||[]).some(filledD));
const sess=d=>S.sessions[d]||null;
const arrOf=(d,id)=>(S.sessions[d]&&S.sessions[d].ex[id])||[];
const exHas=(d,id)=>arrOf(d,id).some(anyV);
const sessHasData=s=>!!s&&Object.values(s.ex||{}).some(a=>a.some(anyV));
const finished=s=>!!s&&!!(s.done||s.end);
const datesDesc=()=>Object.keys(S.sessions).filter(k=>sessHasData(S.sessions[k])).sort().reverse();
const before=d=>datesDesc().filter(k=>k<d);
const exList=d=>PROGRAM.concat(RETIRED.filter(e=>exHas(d,e.id)));
const viewList=d=>ALL.filter(e=>exHas(d,e.id));
const totalOf=d=>exList(d).reduce((a,e)=>a+e.sets,0);
function doneCount(d,e){const a=arrOf(d,e.id);let n=0;for(let i=0;i<e.sets;i++)if(isDone(a[i],e))n++;return n}
const totalDone=d=>exList(d).reduce((n,e)=>n+doneCount(d,e),0);
const firstOpen=d=>exList(d).find(e=>doneCount(d,e)<e.sets);
function prevSess(id,d){for(const k of before(d)){const a=S.sessions[k].ex[id];if(a&&a.some(anyV))return{d:k,a}}return null}
const prevSet=(id,d,i)=>{const p=prevSess(id,d);return p?p.a[i]:null};
function newSess(d){const s=S.sessions[d]={t0:Date.now(),t1:Date.now(),ex:{}};if(S.active&&S.active.d===d)s.start=S.active.t0;return s}
function setOf(d,id,i){const s=S.sessions[d]||newSess(d);const a=s.ex[id]||(s.ex[id]=[]);while(a.length<=i)a.push({w:null,r:null});return a[i]}
function setVal(d,id,i,f,v,j){
  if(v!=null||S.sessions[d]){
    const st=setOf(d,id,i);
    if(j==null)st[f]=v;else{st.d=st.d||[];while(st.d.length<=j)st.d.push({w:null,r:null});st.d[j][f]=v}
    const s=S.sessions[d];s.t1=Date.now();
  }
  save();
}
// חזרות בסט כולל ירידות משקל
const tr=s=>(s.r||0)+(s.d||[]).reduce((a,x)=>a+(has(x.r)?x.r:0),0);
const better=(x,y,e)=>e.bw?x.r>y.r:(x.w>y.w||(x.w===y.w&&tr(x)>tr(y)));
function best(a,e){let b=null;for(const s of a||[])if(isDone(s,e)&&(!b||better(s,b,e)))b=s;return b}
function bestBefore(id,d){const e=EX[id];let b=null;for(const k of before(d)){const s=best(S.sessions[k].ex[id],e);if(s&&(!b||better(s,b,e)))b=s}return b}
function isPR(id,d){const e=EX[id],c=best(arrOf(d,id),e),b=bestBefore(id,d);return!!(c&&b&&better(c,b,e))}
function readyUp(id,d){
  const e=EX[id];if(e.bw||!e.reps)return false;
  const p=prevSess(id,d);if(!p)return false;
  for(let i=0;i<e.sets;i++){const s=p.a[i];if(!isDone(s,e)||s.r<e.reps)return false}
  const pw=Math.max(...p.a.slice(0,e.sets).map(s=>s.w));
  return!arrOf(d,id).some(s=>s&&has(s.w)&&s.w>pw);
}
const setTxt=(b,e)=>e.bw?`${b.r} חזרות`:`${wT(e,b.w)}×${b.r}`;
// "30×8+25×7" — כולל ירידות משקל; משקל כולל
function setStr(s,e){
  if(e.bw)return`<span class="ltr">${s.r??'–'}</span>`;
  const parts=[`${wT(e,s.w)}×${s.r??'–'}`].concat((s.d||[]).filter(filledD).map(x=>`${wT(e,x.w)}×${x.r??'–'}`));
  return`<span class="ltr">${parts.join('+')}</span>`;
}
function stats(d){
  const s=sess(d);let sets=0,vol=0;const imp=[],prs=[];
  for(const e of exList(d)){
    const a=arrOf(d,e.id);
    for(let i=0;i<a.length;i++){const x=a[i];
      if(i<e.sets&&isDone(x,e))sets++;
      if(!e.bw&&x){if(has(x.w)&&has(x.r))vol+=tw(e,x.w)*x.r;for(const y of x.d||[])if(has(y.w)&&has(y.r))vol+=tw(e,y.w)*y.r}}
    const c=best(a,e);if(!c)continue;
    const p=prevSess(e.id,d),pb=p&&best(p.a,e);
    if(pb&&better(c,pb,e))imp.push({e,from:pb,to:c});
    if(isPR(e.id,d))prs.push(e.id);
  }
  const st=s&&(s.start||s.t0),en=s&&(s.end||s.t1);
  return{sets,vol:Math.round(vol),dur:st&&en?Math.round((en-st)/6e4):0,imp,prs};
}

(()=>{let y0=null,dy=0;
  sheetEl.addEventListener('touchstart',e=>{const body=sheetEl.querySelector('.sh-body');if(e.target.closest('.sh-top')||(body&&body.scrollTop<=0&&e.target.closest('.sh-body'))){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
  sheetEl.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sheetEl.style.transition='none';sheetEl.style.transform=`translateY(${dy}px)`}},{passive:true});
  sheetEl.addEventListener('touchend',()=>{if(y0==null)return;sheetEl.style.transition='';sheetEl.style.transform='';if(dy>90)closeSheet();y0=null});
})();

/* ---------- טוסט ---------- */
let toastT,toastUndo=null;
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">ביטול</button>':''}`;
  toastUndo=undo||null;t.style.pointerEvents=undo?'auto':'none';t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');t.style.pointerEvents='none';toastUndo=null},undo?6000:2400)}

/* =========================================================
   אירועים
   ========================================================= */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.val;
  switch(act){
    case'tab':if(sheetOpen)closeSheet();if(tab===v&&subs[v]){leaveSub();break}tab=v;render(true);scrollTo(0,0);break;
    case'month':shiftMonth(+v);break;
    case'mnow':calM=today().slice(0,7);render(true);break;
    case'start':startLive();break;
    case'cancel':{const s=sess(today());if(s&&!sessHasData(s))delete S.sessions[today()];S.active=null;save();render();toast('האימון בוטל');break}
    case'openday':openSub('w',{mode:'view',d:v});break;
    case'openh':openSub('h',{mode:'view',d:v});break;
    case'back':leaveSub();break;
    case'edit':subs[tab].mode='edit';userCol={};render(true);scrollTo(0,0);break;
    case'editdone':subs[tab].mode='view';render(true);scrollTo(0,0);break;
    case'migok':delete S.migNote;save();render();break;
    case'toggle':{const el=document.getElementById('ex-'+v),on=!el.classList.contains('col');userCol[v]=on;setCol(el,on);break}
    case'jump':{const el=document.getElementById('ex-'+v);if(!el)break;if(el.classList.contains('col')){userCol[v]=false;setCol(el,false)}el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});break}
    case'ghost':{
      const id=b.dataset.ex,i=+b.dataset.i,e=EX[id],c=arrOf(cur,id)[i],pv=prevSet(id,cur,i);
      if(isDone(c,e))break;
      if(anyV(pv)){
        const el=document.getElementById('ex-'+id),wasComp=el.classList.contains('comp');
        if(!el.classList.contains('col'))userCol[id]=false;
        if(!e.bw&&has(pv.w)&&!(c&&has(c.w)))setVal(cur,id,i,'w',pv.w);
        if(has(pv.r)&&!(c&&has(c.r)))setVal(cur,id,i,'r',pv.r);
        (pv.d||[]).forEach((x,j)=>{const cc=arrOf(cur,id)[i],cd=cc&&cc.d&&cc.d[j];
          if(has(x.w)&&!(cd&&has(cd.w)))setVal(cur,id,i,'w',x.w,j);
          if(has(x.r)&&!(cd&&has(cd.r)))setVal(cur,id,i,'r',x.r,j)});
        if(!S.tipGhost){S.tipGhost=true;save();const tp=document.querySelector('.tip');if(tp)tp.remove()}
        rerenderCard(id);
        const row=document.querySelector(`#ex-${id} .set[data-i="${i}"]:not(.drop):not(.sh)`);
        if(row&&row.classList.contains('done')){haptic();restart(row,'just')}
        refresh(id,wasComp);
        if(justDone.has(id))setTimeout(()=>leave(document.getElementById('ex-'+id)),550);
      }else{const row=b.closest('.set'),ins=[...row.querySelectorAll('.in')];(ins.find(x=>!x.value)||ins[0]).focus()}
      break}
    case'adddrop':{
      const id=b.dataset.ex,i=+b.dataset.i,e=EX[id],c=arrOf(cur,id)[i],pv=prevSet(id,cur,i);
      const n=dropCount(cur,e,i,c,pv),st=setOf(cur,id,i);st.d=st.d||[];while(st.d.length<=n)st.d.push({w:null,r:null});save();
      userCol[id]=false;rerenderCard(id);
      const inp=document.querySelector(`#ex-${id} .set.drop[data-i="${i}"][data-j="${n}"] .in`);if(inp)inp.focus();
      break}
    case'rmdrop':{
      const id=b.dataset.ex,i=+b.dataset.i,j=+b.dataset.j,c=arrOf(cur,id)[i];
      if(c&&c.d&&j<c.d.length)c.d.splice(j,1);
      hideGhost.add(cur+'|'+id+'|'+i);save();userCol[id]=false;rerenderCard(id);refresh(id);break}
    case'finish':openFinish();break;
    case'delsess':{const d=cur,keep=JSON.stringify(S.sessions[d]);delete S.sessions[d];if(S.active&&S.active.d===d)S.active=null;save();leaveSub();
      toast('האימון נמחק',()=>{S.sessions[d]=JSON.parse(keep);save();render();toast('שוחזר')});break}
    case'hseg':hseg=v;render(true);break;
    case'exhist':openExSheet(v);break;
    case'close':closeSheet();break;
    case'undo':if(toastUndo){const u=toastUndo;toastUndo=null;u()}break;
    case'share':doShare();break;
    case'import':document.getElementById('imp').click();break;
    case'doimport':if(pendingImport){S=pendingImport;if(!S.sessions)S.sessions={};pendingImport=null;migrate();save();closeSheet();subs.w=subs.h=null;userCol={};prFired.clear();render(true);toast('הגיבוי שוחזר')}break;
    case'refresh':(async()=>{try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}location.reload()})();break;
  }
});
view.addEventListener('input',ev=>{
  const t=ev.target;if(!t.matches('.in'))return;
  const f=t.dataset.f,raw=t.value,id=t.dataset.ex,i=+t.dataset.i,j=t.dataset.j!=null?+t.dataset.j:null;
  const c=f==='w'?raw.replace(/,/g,'.').replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1').slice(0,6):raw.replace(/\D/g,'').slice(0,3);
  if(c!==raw)t.value=c;
  const n=c===''||c==='.'?null:parseFloat(c),val=Number.isFinite(n)?n:null;
  setVal(cur,id,i,f,val,j);
  t.classList.toggle('has',t.value!=='');
  const box=t.parentElement;
  if(box.classList.contains('wbox')){const e=EX[id],pv=prevSet(id,cur,i),pw=j==null?(pv&&pv.w):(pv&&pv.d&&pv.d[j]&&pv.d[j].w);const sp=box.querySelector('.tot');sp.textContent=totTxt(e,val,pw);sp.classList.toggle('g',val==null)}
  rowUpdate(id,i);refresh(id);
});
view.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||!ev.target.matches('.in'))return;ev.preventDefault();
  const list=[...ev.target.closest('.ex').querySelectorAll('.in')],k=list.indexOf(ev.target);
  if(k<list.length-1)list[k+1].focus();else ev.target.blur();
});
view.addEventListener('focusout',ev=>{const c=ev.target.closest&&ev.target.closest('.ex');if(c)setTimeout(()=>leave(c),150)});
document.addEventListener('focusin',ev=>{if(ev.target.matches('.in')){document.body.classList.add('kb');setTimeout(()=>{try{ev.target.select()}catch(e){}},0)}});
document.addEventListener('focusout',ev=>{if(ev.target.matches('.in'))setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches('.in'))document.body.classList.remove('kb')},80)});
// החלקה בין חודשים
(()=>{let t0=null;
  view.addEventListener('touchstart',e=>{t0=(tab==='w'&&!subs.w&&!sheetOpen&&e.touches.length===1)?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
  view.addEventListener('touchend',e=>{if(!t0)return;const p=e.changedTouches[0],dx=p.clientX-t0.x,dy=p.clientY-t0.y;t0=null;
    if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.8)shiftMonth(dx>0?1:-1)},{passive:true});
})();
// שעון האימון
setInterval(()=>{const a=S.active;if(!a||document.hidden)return;const t=durTxt(Date.now()-a.t0);for(const id of ['timer','ctimer']){const el=document.getElementById(id);if(el)el.textContent=t}},1000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||sheetOpen||document.body.classList.contains('kb'))return;
  endStale();
  const sub=subs[tab];
  if(sub&&sub.mode==='live'&&!S.active){subs[tab]=null;render(true);return}
  if(!sub||sub.mode==='view'){if(!sub)calM=calM||today().slice(0,7);render()}
});
{const q=new URLSearchParams(location.search).get('tab');if(['w','h','b'].includes(q))tab=q}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

// אימון פעיל → נפתחים ישר בתוכו (חזרה אחורה = לוח השנה)
if(S.active&&S.active.d===today()&&tab==='w'){subs.w={mode:'live',d:today()};history.pushState({sub:1},'')}
render(true);
if(subs.w&&totalDone(today())>0){const nx=firstOpen(today());if(nx)requestAnimationFrame(()=>{const el=document.getElementById('ex-'+nx.id);el&&el.scrollIntoView({block:'start'})})}
}
</script>
