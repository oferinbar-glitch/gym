<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#F3F2EF">
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>האימון שלי</title>
<link rel="preload" href="fonts/ibm-plex-sans-hebrew-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* =====================================================================
   האימון שלי · 2.0
   1. משקל מעביר משמעות: 600 לכותרת, 500 לתווית, 400 לתוכן. מספרים בגופן צר.
   2. משטח לבן אחד על רקע גיר. קווים דקים בין שורות, לא מסגרת סביב כל דבר.
   3. הכתום שמור לפעולה ולמצב "עכשיו". ירוק = בוצע. זהב = שיא.
   4. תנועה רק כתגובה ללחיצה (140–220ms). רגע אחד מתוזמר: הצלחת מתגלגלת פנימה.
   ===================================================================== */
@font-face{font-family:"Plex";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-hebrew-hebrew-400-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Plex";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-hebrew-hebrew-500-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Plex";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-hebrew-hebrew-600-normal.woff2) format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Plex";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-hebrew-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plex";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-hebrew-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plex";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-hebrew-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Num";font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Num";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Num";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#F3F2EF; --surface:#FFFFFF; --fill:#EEEDE9; --fill-2:#E5E4DF;
  --ink:#000000; --ink-2:rgba(0,0,0,.6); --ink-3:rgba(0,0,0,.4); --ghost:rgba(0,0,0,.26);
  --sep:rgba(0,0,0,.09); --hair:.5px;
  --brand:#FF5B14; --brand-ink:#C93F05; --brand-soft:#FFEADF; --on-brand:#FFFFFF;
  --ok:#14A05B; --ok-ink:#0C7A43; --ok-soft:#E2F3E9;
  --gold:#9A6B00; --gold-soft:#FBEFC9;
  --bad:#D92D20; --bad-soft:#FCE6E4;
  --f:"Plex",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fn:"Num","Plex",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --fast:140ms; --med:220ms;
  --r:12px; --r-card:18px;
  color-scheme:only light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
svg{flex:none}
.n{font-family:var(--fn);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{font-size:14px;color:var(--ink-2);margin:0;line-height:1.5}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(243,242,239,.86);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);padding:max(10px,env(safe-area-inset-top)) 16px 8px}
.top-in{max-width:560px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;padding-top:6px}
.ph h1{margin:0;flex:1;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-top:12px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2);text-align:center;transition:background var(--fast),color var(--fast)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(104px + env(safe-area-inset-bottom))}

/* session header */
.sh{display:flex;align-items:center;gap:10px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none;transition:transform var(--fast) var(--ease)}
.ib svg{width:19px;height:19px}
.ib:active{transform:scale(.92)}
.sh-mid{flex:1;text-align:center;line-height:1.15}
.sh-mid .t{display:block;font-size:15px;font-weight:600}
.sh-mid .s{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);margin-top:2px}
.sh-mid .s .n{font-size:16px;color:var(--ink)}
.timer{font-size:22px!important;color:var(--brand-ink)!important}
.pill{height:36px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--fill);color:var(--ink);flex:none;transition:transform var(--fast) var(--ease),opacity var(--med)}
.pill svg{width:16px;height:16px}
.pill.pri{background:var(--brand);color:var(--on-brand)}
.pill.ok{background:var(--ok);color:#fff}
.pill:active{transform:scale(.96)}
.pill.off{opacity:.35;pointer-events:none}
.segs{display:grid;gap:3px;margin-top:10px}
.segs button{padding:6px 0}
.segs span{display:block;height:4px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.segs i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width var(--med) var(--ease),background var(--med)}
.segs .full i{background:var(--ok)}
.segs .cur span{outline:1.5px solid var(--brand);outline-offset:1px}

/* ---------- lists / cards ---------- */
.card{background:var(--surface);border-radius:var(--r-card);overflow:hidden;margin-bottom:12px}
.lbl{font-size:13px;font-weight:500;color:var(--ink-2);margin:20px 4px 8px}
.lbl:first-child{margin-top:4px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);margin-bottom:12px;font-size:14px;color:var(--ink-2);line-height:1.45}
.note svg{width:18px;height:18px;color:var(--brand-ink);margin-top:1px}
.note b{color:var(--ink);font-weight:600}
.note .acts{display:flex;gap:8px;margin-top:10px}
.mrow{display:block;margin-top:4px;color:var(--ink)}
.prevline{font-size:13px;color:var(--ink-2);margin:0 4px 12px}
.prevline b{color:var(--ink);font-weight:500}

/* stat grid: one object, hairlines between */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r-card);margin-bottom:12px}
.stats>div{padding:14px 14px 12px;position:relative}
.stats>div+div{border-right:1px solid var(--sep)}
.stats small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500}
.stats .n{display:block;font-size:30px;line-height:1.05;margin-top:4px}
.stats .n i{font-style:normal;font-family:var(--f);font-size:13px;color:var(--ink-3);font-weight:500;margin-right:3px}

/* ---------- exercise (live/edit) ---------- */
.ex{background:var(--surface);border-radius:var(--r-card);margin-bottom:10px;scroll-margin-top:120px;position:relative;transition:box-shadow var(--med)}
.ex.now{box-shadow:0 0 0 1.5px var(--brand)}
.exh{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px 10px}
.exn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--fn);font-weight:600;font-size:15px;background:var(--fill);color:var(--ink-2);transition:background var(--med),color var(--med)}
.exn svg{width:14px;height:14px;display:none}
.ex.now .exn{background:var(--brand);color:#fff}
.ex.comp .exn{background:var(--ok);color:#fff}
.ex.comp .exn .k{display:none}
.ex.comp .exn svg{display:block}
.ext{flex:1;min-width:0}
.ext b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.ext small{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--ink-2);margin-top:2px}
.ext small span{display:inline-flex;align-items:center;gap:4px}
.ext small svg{width:13px;height:13px;color:var(--ink-3)}
.ext small .n{font-size:15px;color:var(--ink)}
.exst{display:flex;align-items:center;gap:6px;flex:none}
.chev{color:var(--ink-3);display:flex;transition:transform var(--med) var(--ease)}
.chev svg{width:18px;height:18px}
.ex:not(.col) .chev{transform:rotate(180deg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.now{background:var(--brand-soft);color:var(--brand-ink)}
.tag.cnt{background:var(--fill);color:var(--ink-2)}
.tag.cnt .n{font-size:14px;color:var(--ink)}
.tag.pr{background:var(--gold-soft);color:var(--gold)}
.exb,.exs{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--med) var(--ease)}
.exs{grid-template-rows:0fr}
.ex.col .exb{grid-template-rows:0fr}
.ex.col .exs{grid-template-rows:1fr}
.clip{overflow:hidden;min-height:0}
.sumline{margin:0;padding:0 54px 14px 16px;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;row-gap:4px}
.last{margin:0 16px;padding:8px 0 2px;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;border-top:var(--hair) solid var(--sep)}
.last>span:first-child{margin-left:8px}
.hint{display:flex;align-items:center;gap:6px;margin:4px 16px 0;font-size:13px;font-weight:500;color:var(--ok-ink)}
.hint svg{width:14px;height:14px}
.sets{padding:6px 12px 10px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 30px 40px;align-items:center;gap:8px;padding:4px 0}
.set.bw{grid-template-columns:30px minmax(0,1fr) 30px 40px}
.set.hd{padding:2px 0 0;font-size:12px;font-weight:500;color:var(--ink-3)}
.set.hd span{text-align:center}
.si{position:relative;text-align:center;font-family:var(--fn);font-weight:600;font-size:17px;color:var(--ink-3);transition:color var(--med)}
.set.done .si{color:var(--ink)}
.si i{position:absolute;top:-6px;left:-2px;font-style:normal;font-size:11px;line-height:1}
.si i.up{color:var(--ok)}
.si i.dn{color:var(--bad)}
.in{width:100%;height:50px;border-radius:var(--r);border:0;background:var(--fill);text-align:center;font-family:var(--fn);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;outline:none;padding:0 4px;direction:ltr;transition:background var(--fast),box-shadow var(--fast);-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--ghost);opacity:1}
.in:focus{background:var(--surface);box-shadow:inset 0 0 0 2px var(--brand)}
.set.done .in{background:var(--ok-soft)}
.set.done .in:focus{background:var(--surface)}
.ck{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--fill-2);color:var(--ink-3);transition:transform var(--fast) var(--ease),background var(--med),box-shadow var(--med)}
.ck svg{width:18px;height:18px;opacity:.5}
.ck:active{transform:scale(.9)}
.set.done .ck{background:var(--ok);box-shadow:none;color:#fff}
.set.done .ck svg{opacity:1}
.ab{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);transition:transform var(--fast) var(--ease)}
.ab svg{width:16px;height:16px}
.ab:active{transform:scale(.9);background:var(--fill)}
.set.drop{padding-top:0}
.set.drop .in{height:42px;font-size:20px;background:none;box-shadow:inset 0 0 0 1.5px var(--fill-2)}
.set.drop .in:focus{box-shadow:inset 0 0 0 2px var(--brand)}
.set.drop .in.has{background:var(--ok-soft);box-shadow:none}
.dropi{display:grid;place-items:center;color:var(--ink-3)}
.dropi svg{width:16px;height:16px;transform:scaleX(-1)}
.wbox{position:relative;display:block}
.wbox .in{padding-bottom:12px}
.set.drop .wbox .in{padding-bottom:10px}
.wbox .tot{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10.5px;font-weight:500;color:var(--ink-2);pointer-events:none;white-space:nowrap}
.set.drop .wbox .tot{bottom:3px;font-size:10px}
.wbox .tot.g{color:var(--ghost)}

/* set strings: weight ק״ג × reps */
.st{display:inline-flex;align-items:baseline;gap:3px;direction:rtl;unicode-bidi:isolate;white-space:nowrap;color:var(--ink)}
.st b{font-family:var(--fn);font-weight:600;font-size:1.15em;font-variant-numeric:tabular-nums}
.st .u{font-style:normal;font-size:.78em;color:var(--ink-2)}
.st .x{font-style:normal;color:var(--ink-3);margin:0 1px}
.st .pl{font-style:normal;color:var(--ink-3);margin:0 4px}
.sep{display:inline-block;width:1px;height:1em;background:var(--sep);box-shadow:0 0 0 .3px var(--sep);margin:0 10px;align-self:center}
.grp{display:inline-flex;align-items:center;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-size:16px;font-weight:600;background:var(--fill);color:var(--ink);transition:transform var(--fast) var(--ease)}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.block{width:100%;height:52px}
.btn.line{background:var(--surface)}
.btn.wa{background:#1FAF55;color:#fff}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.badfill{background:var(--bad);color:#fff}
.btn.off{opacity:.35;pointer-events:none}
.endbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* ---------- home ---------- */
.home{min-height:calc(100dvh - 170px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hdate{margin:0;font-size:17px;font-weight:500;color:var(--brand-ink)}
.hclock{margin:0;font-family:var(--fn);font-weight:600;font-size:72px;line-height:1;letter-spacing:-.01em;color:var(--brand);font-variant-numeric:tabular-nums;direction:ltr}
.dude{width:min(78vw,300px);aspect-ratio:1;margin:4px 0 0}
.dude svg{display:block}
.startbtn{max-width:360px;height:62px!important;font-size:18px!important;border-radius:18px;margin:4px 0 16px;gap:10px}
.startbtn svg{width:22px;height:22px}
.startbtn .ct{font-size:18px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:999px;margin-right:4px;direction:ltr}
.startbtn.ok{background:var(--ok);color:#fff}
.startbtn.ok .ct{font-family:var(--f);font-size:14px;direction:rtl}
.hlast{margin:0;font-size:14px;color:var(--ink-2)}
.hlast b{font-weight:500;color:var(--ink)}
.linkbtn{display:block;margin:14px auto 0;font-size:14px;font-weight:500;color:var(--ink-2);padding:6px 10px}

/* ---------- calendar ---------- */
.calnav{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.calnav h2{flex:1;margin:0;text-align:center;font-size:19px;font-weight:600}
.calnav .pill{height:32px;font-size:14px;padding:0 12px;background:var(--surface)}
.cal{background:var(--surface);border-radius:var(--r-card);padding:12px 8px 6px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;justify-items:center}
.calg .h{font-size:12px;color:var(--ink-3);font-weight:500;padding-bottom:4px}
.cd{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--fn);font-weight:500;font-size:18px;color:var(--ink);transition:background var(--fast)}
.cd.out{visibility:hidden}
.cd.fut{color:var(--ink-3)}
.cd.w{font-weight:600}
.cd.w .dn{font-size:14px;line-height:1}
.cd.today{color:var(--brand-ink);box-shadow:inset 0 0 0 2px var(--brand);font-weight:700}
.cd.sel{background:var(--fill)}
.cd:active{background:var(--fill-2)}
.dbi{width:20px;height:12px;display:block;color:var(--brand)}
.dbi svg{width:100%;height:100%;fill:currentColor;display:block}
.calsum{display:grid;grid-template-columns:repeat(3,1fr);margin:8px 6px 0;padding-top:10px;border-top:var(--hair) solid var(--sep)}
.calsum div{text-align:center;padding-bottom:6px}
.calsum .n{display:block;font-size:22px;line-height:1.1}
.calsum small{font-size:12px;color:var(--ink-2)}
.selbox{margin-top:12px}
.nosel{text-align:center;color:var(--ink-3);font-size:14px;margin:18px 0}

/* day row */
.drow{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border-radius:var(--r-card);padding:14px 16px;text-align:right;transition:transform var(--fast) var(--ease)}
.drow:active{transform:scale(.985)}
.drow .dt{flex:1}
.drow .dt b{display:block;font-size:17px;font-weight:600}
.drow .dt small{font-size:13px;color:var(--ink-2)}
.drow .dv{display:flex;gap:16px;text-align:center}
.drow .dv .n{display:block;font-size:22px;line-height:1.05}
.drow .dv small{font-size:11.5px;color:var(--ink-2)}
.drow .chev{transform:none!important}
.hdots{display:grid;gap:3px;margin-top:10px}
.hdots i{height:4px;border-radius:4px;background:var(--fill-2)}
.hdots i.on{background:var(--ok)}
.hdots i.part{background:var(--brand);opacity:.5}

/* progress list */
.plist{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;text-align:right;position:relative}
.prow+.prow::before{content:"";position:absolute;top:0;right:16px;left:0;height:var(--hair);background:var(--sep);box-shadow:0 0 0 .25px var(--sep)}
.prow:active{background:var(--fill)}
.pv{flex:1;min-width:0}
.pv b{display:block;font-size:16px;font-weight:600}
.pv b small{font-weight:400;font-size:12.5px;color:var(--ink-3)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:rgba(28,28,28,.94);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity var(--med),transform var(--med) var(--ease);z-index:60;white-space:nowrap;display:flex;align-items:center;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){
  main.enter{animation:fade .22s ease-out both}
  main.enter .startbtn{animation:fade .4s ease-out both}
  .set.just .ck{animation:tick .32s var(--ease)}
  .bump{animation:bump .3s var(--ease)}

  main.anim-next{animation:mNext .24s var(--ease)}
  main.anim-prev{animation:mPrev .24s var(--ease)}
}
@keyframes fade{from{opacity:0}}
@keyframes tick{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:none}}

/* ---------- rest timer ---------- */

.rest .rb{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none;transition:transform var(--fast) var(--ease)}

.rmid{flex:1;text-align:center;min-width:0}

.rbar{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.15);margin:6px 8px 2px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .25s linear;margin-right:auto;margin-left:0;float:right}
.rest.soon .rmid b{color:#FF9A6B}
.rest.over{background:var(--ok)}
.rest.over .rbar i{background:#fff}
body.resting main{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
body.resting .toast{bottom:calc(160px + env(safe-area-inset-bottom))}
.rest .rb .n{direction:ltr;unicode-bidi:isolate}
.rest.over .rmid b{color:#fff}
</style>

<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="view"></main>
<nav class="tabs"><div class="in2" id="nav"></div></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="rest" id="rest" role="timer" aria-live="off"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="lottie.js" defer></script>
<script src="confetti.js" defer></script>
<script>
"use strict";
{
const VERSION='2.2';

/* =========================================================
   התוכנית — לשנות כאן תרגילים / סדר / יעדים.
   id קבוע: אסור לשנות id של תרגיל קיים, אחרת ההיסטוריה שלו תתנתק.
   rest בשניות. reps:null = מקסימום. bw:true = בלי משקל.
   bar = משקל המוט; ברשומה מזינים משקל לצד אחד, והסה״כ = מוט + 2 × צד.
   ========================================================= */
const PROGRAM=[
  {id:'bench',    n:'לחיצת חזה חופשי',                      sets:3, reps:8,  rest:90},
  {id:'pulldown', n:'פולי עליון',       sub:'אחיזה ניטרלית', sets:3, reps:6,  rest:120},
  {id:'legext',   n:'פשיטת רגליים',                         sets:3, reps:10, rest:75},
  {id:'legcurl',  n:'כפיפת רגליים',                         sets:3, reps:10, rest:75},
  {id:'latraise', n:'הרחקת כתפיים',                         sets:3, reps:15, rest:50},
  {id:'curl',     n:'דו־ראשי',          sub:'מוט אולימפי',   sets:3, reps:8,  rest:90, bar:20},
  {id:'skull',    n:'לחיצה צרפתית',                         sets:3, reps:8,  rest:90, bar:7.5},
  {id:'calf',     n:'תאומים בישיבה',                        sets:3, reps:12, rest:75},
  {id:'absm',     n:'בטן במכונה',                           sets:3, reps:20, rest:null},
];
// תרגילים שיצאו מהתוכנית — נשארים בהיסטוריה
const RETIRED=[
  {id:'abs', n:'בטן', sub:'בוסו', sets:3, reps:null, rest:null, bw:true, retired:true},
];
const ALL=[...PROGRAM,...RETIRED];
const EX=Object.fromEntries(ALL.map(e=>[e.id,e]));

/* ---------- עזרים ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const dm=s=>{const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)};
const wday=s=>pd(s).toLocaleDateString('he-IL',{weekday:'long'});
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const rel=s=>{const n=dayDiff(s,today());return n<=0?'היום':n===1?'אתמול':n===2?'שלשום':`לפני ${n} ימים`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'':String(+(+n).toFixed(2));
const restTxt=s=>s<60?`${s} שנ׳`:`${Math.floor(s/60)}:${pad(s%60)} דק׳`;
const durTxt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`};
const haptic=p=>{try{navigator.vibrate&&navigator.vibrate(p||8)}catch(e){}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const has=v=>v!=null;
const tw=(e,w)=>w==null?null:(e.bar!=null?e.bar+2*w:w);   // משקל כולל
const wT=(e,w)=>has(w)?fmt(tw(e,w)):'–';

/* ---------- אחסון ---------- */
const KEY='gymTracker.v1';
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
let S=load()||{v:2,created:Date.now(),lastExport:null,sessions:{}};
if(!S.sessions)S.sessions={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
if(storageOK&&navigator.storage&&navigator.storage.persist&&location.protocol.startsWith('http'))navigator.storage.persist().catch(()=>{});

// v1 → v2: בדו־ראשי ובצרפתית עוברים לרישום "משקל לצד"
function migrate(){
  if((S.v||1)>=2)return;
  const notes=[];
  for(const [d,s] of Object.entries(S.sessions)){
    for(const id of ['curl','skull']){
      const e=EX[id],a=s.ex&&s.ex[id];if(!a)continue;const seen=new Map();
      for(const st of a){if(!st||!has(st.w))continue;const was=st.w;
        if(was>=e.bar)st.w=Math.round((was-e.bar)/2*4)/4;
        seen.set(was+'|'+st.w,[was,st.w])}
      if(seen.size)notes.push({d,id,vals:[...seen.values()]});
    }
    if(s.done&&!s.end)s.end=s.t1;
  }
  S.v=2;if(notes.length)S.migNote=notes;save();
}
migrate();

/* ---------- נתונים ---------- */
const filledD=x=>!!x&&(has(x.w)||has(x.r));
const isDone=(s,e)=>!!s&&has(s.r)&&(e.bw||has(s.w));
const anyV=s=>!!s&&(has(s.w)||has(s.r)||(s.d||[]).some(filledD));
const sess=d=>S.sessions[d]||null;
const arrOf=(d,id)=>(S.sessions[d]&&S.sessions[d].ex[id])||[];
const exHas=(d,id)=>arrOf(d,id).some(anyV);
const sessHasData=s=>!!s&&Object.values(s.ex||{}).some(a=>a.some(anyV));
const finished=s=>!!s&&!!(s.done||s.end);
const datesDesc=()=>Object.keys(S.sessions).filter(k=>sessHasData(S.sessions[k])).sort().reverse();
const before=d=>datesDesc().filter(k=>k<d);
const exList=d=>PROGRAM.concat(RETIRED.filter(e=>exHas(d,e.id)));
const viewList=d=>ALL.filter(e=>exHas(d,e.id));
const totalOf=d=>exList(d).reduce((a,e)=>a+e.sets,0);
function doneCount(d,e){const a=arrOf(d,e.id);let n=0;for(let i=0;i<e.sets;i++)if(isDone(a[i],e))n++;return n}
const totalDone=d=>exList(d).reduce((n,e)=>n+doneCount(d,e),0);
const firstOpen=d=>exList(d).find(e=>doneCount(d,e)<e.sets);
function prevSess(id,d){for(const k of before(d)){const a=S.sessions[k].ex[id];if(a&&a.some(anyV))return{d:k,a}}return null}
const prevSet=(id,d,i)=>{const p=prevSess(id,d);return p?p.a[i]:null};
function newSess(d){const s=S.sessions[d]={t0:Date.now(),t1:Date.now(),ex:{}};if(S.active&&S.active.d===d)s.start=S.active.t0;return s}
function setOf(d,id,i){const s=S.sessions[d]||newSess(d);const a=s.ex[id]||(s.ex[id]=[]);while(a.length<=i)a.push({w:null,r:null});return a[i]}
function setVal(d,id,i,f,v,j){
  if(v!=null||S.sessions[d]){
    const st=setOf(d,id,i);
    if(j==null)st[f]=v;else{st.d=st.d||[];while(st.d.length<=j)st.d.push({w:null,r:null});st.d[j][f]=v}
    const s=S.sessions[d];s.t1=Date.now();
  }
  save();
}
// חזרות בסט כולל ירידות משקל
const tr=s=>(s.r||0)+(s.d||[]).reduce((a,x)=>a+(has(x.r)?x.r:0),0);
const better=(x,y,e)=>e.bw?x.r>y.r:(x.w>y.w||(x.w===y.w&&tr(x)>tr(y)));
function best(a,e){let b=null;for(const s of a||[])if(isDone(s,e)&&(!b||better(s,b,e)))b=s;return b}
function bestBefore(id,d){const e=EX[id];let b=null;for(const k of before(d)){const s=best(S.sessions[k].ex[id],e);if(s&&(!b||better(s,b,e)))b=s}return b}
function isPR(id,d){const e=EX[id],c=best(arrOf(d,id),e),b=bestBefore(id,d);return!!(c&&b&&better(c,b,e))}
function readyUp(id,d){
  const e=EX[id];if(e.bw||!e.reps)return false;
  const p=prevSess(id,d);if(!p)return false;
  for(let i=0;i<e.sets;i++){const s=p.a[i];if(!isDone(s,e)||s.r<e.reps)return false}
  const pw=Math.max(...p.a.slice(0,e.sets).map(s=>s.w));
  return!arrOf(d,id).some(s=>s&&has(s.w)&&s.w>pw);
}
const seg=(w,r,e)=>`<b>${wT(e,w)}</b><i class="u">ק״ג</i><i class="x">×</i><b>${r??'–'}</b>`;
const setTxt=(b,e)=>e.bw?`<span class="st"><b>${b.r}</b><i class="u">חזרות</i></span>`:`<span class="st">${seg(b.w,b.r,e)}</span>`;
// "30×8+25×7" — כולל ירידות משקל; משקל כולל
function setStr(s,e){
  if(e.bw)return`<span class="st"><b>${s.r??'–'}</b></span>`;
  const parts=[s].concat((s.d||[]).filter(filledD)).map(g=>seg(g.w,g.r,e));
  return`<span class="st">${parts.join('<i class="pl">+</i>')}</span>`;
}
function stats(d){
  const s=sess(d);let sets=0,vol=0;const imp=[],prs=[];
  for(const e of exList(d)){
    const a=arrOf(d,e.id);
    for(let i=0;i<a.length;i++){const x=a[i];
      if(i<e.sets&&isDone(x,e))sets++;
      if(!e.bw&&x){if(has(x.w)&&has(x.r))vol+=tw(e,x.w)*x.r;for(const y of x.d||[])if(has(y.w)&&has(y.r))vol+=tw(e,y.w)*y.r}}
    const c=best(a,e);if(!c)continue;
    const p=prevSess(e.id,d),pb=p&&best(p.a,e);
    if(pb&&better(c,pb,e))imp.push({e,from:pb,to:c});
    if(isPR(e.id,d))prs.push(e.id);
  }
  const st=s&&(s.start||s.t0),en=s&&(s.end||s.t1);
  return{sets,vol:Math.round(vol),dur:st&&en?Math.round((en-st)/6e4):0,imp,prs};
}
// אימון פעיל שנשאר פתוח מיום קודם — נסגר אוטומטית

    // תרגילים
    list.forEach((e,k)=>{
      const SF={b:'600 40px',u:'500 22px',x:'500 28px'},SC={b:C.ink,u:C.ink2,x:C.ink3},GAP={b:6,u:12,x:10};
      const segW=t=>t.reduce((a,[v,k])=>{x.font=`${SF[k]} ${k==='b'?FN:F}`;return a+x.measureText(v).width+GAP[k]},0);
      const chips=chipSegs(d,e);
      const rows=[];let row=[],rw=0;const avail=W-2*P-56;
      chips.forEach((t,i)=>{const cw=segW(t)+40+50;if(row.length&&rw+cw+12>avail){rows.push(row);row=[];rw=0}row.push({t,cw,i});rw+=cw+12});
      if(row.length)rows.push(row);
      const h=92+22+rows.length*66+(rows.length-1)*12+26;
      if(draw){
        x.fillStyle=C.card;rr(x,P,y,W-2*P,h,30);x.fill();
        // כותרת כתומה
        x.save();rr(x,P,y,W-2*P,h,30);x.clip();x.fillStyle=C.brand;x.fillRect(P,y,W-2*P,92);x.restore();
        const R=W-P-28;x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(R-22,y+46,22,0,7);x.fill();
        x.fillStyle='#fff';nfont(600,28);x.textAlign='center';x.direction='ltr';x.fillText(String(k+1),R-22,y+56);
        x.direction='rtl';x.textAlign='right';x.fillStyle='#fff';font(600,36);x.fillText(e.n,R-60,y+59);
        let nx=R-60-x.measureText(e.n).width-14;
        if(e.sub){font(500,26);x.fillStyle='rgba(255,255,255,.8)';x.fillText(e.sub,nx,y+59);nx-=x.measureText(e.sub).width+14}
        // תגים משמאל
        let L=P+28;
        const tag=(txt,bg,fg)=>{font(600,24);const w=x.measureText(txt).width+32;x.fillStyle=bg;rr(x,L,y+26,w,40,20);x.fill();x.fillStyle=fg;x.textAlign='center';x.direction='rtl';x.fillText(txt,L+w/2,y+55);L+=w+10};
        if(st.prs.includes(e.id))tag('שיא אישי','#FFF4C9',C.gold);
        const im=imp[e.id];
        if(im){const v=e.bw?`+${im.to.r-im.from.r} חזרות`:(tw(e,im.to.w)>tw(e,im.from.w)?`+${fmt(tw(e,im.to.w)-tw(e,im.from.w))} ק״ג`:`+${tr(im.to)-tr(im.from)} חזרות`);tag('▲ '+v,'#FFFFFF',C.ok)}
        // צ'יפים
        let cy=y+92+22;
        rows.forEach(r=>{let cx=W-P-28;r.forEach(({t,cw,i})=>{
          x.fillStyle=C.chip;rr(x,cx-cw,cy,cw,66,20);x.fill();
          x.fillStyle=C.ink3;nfont(600,26);x.textAlign='center';x.direction='ltr';x.fillText(String(i+1),cx-24,cy+43);
          x.fillStyle=C.line;x.fillRect(cx-48,cy+14,2,38);
          let tx=cx-62;x.direction='ltr';x.textAlign='left';
          t.forEach(([v,k])=>{x.font=`${SF[k]} ${k==='b'?FN:F}`;x.fillStyle=SC[k];const w=x.measureText(v).width;x.fillText(v,tx-w,cy+45);tx-=w+GAP[k]});x.textAlign='center';
          cx-=cw+12});cy+=66+12});
      }
      y+=h+16;
    });
    y+=20;
    return y+20;
  }
  c.width=W;c.height=2000;const H=pass(false);c.height=H;x.fillStyle=C.bg;x.fillRect(0,0,W,H);pass(true);
  return c;
}

async function doShareImg(){
  if(!shareFile)return;

/* ---------- גיבוי ---------- */

      <div class="stack">
        <button class="btn pri block" data-act="share">${I.share}שמירת גיבוי</button>

      </div>
      <p class="muted" style="margin-top:12px">הנתונים נשמרים רק בטלפון הזה. ניקוי נתוני הדפדפן או מעבר לטלפון אחר ימחקו אותם, וקובץ הגיבוי הוא הדרך היחידה להעביר או לשחזר.</p>

      <div class="stack" style="margin-top:12px"><button class="btn line block" data-act="refresh">${I.repeat}רענון</button></div>

function backupFile(){return{name:`gym-backup-${today()}.json`,blob:new Blob([JSON.stringify(S)],{type:'application/json'})}}
function doExport(){const{name,blob}=backupFile();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);S.lastExport=Date.now();save();render();toast('קובץ הגיבוי ירד')}
async function doShare(){const{name,blob}=backupFile();const f=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});S.lastExport=Date.now();save();render();toast('הגיבוי נשמר')}else doExport()}catch(e){if(e.name!=='AbortError')doExport()}}
let pendingImport=null;
document.getElementById('imp').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||typeof o.sessions!=='object')throw 0;
    pendingImport=o;const n=Object.keys(o.sessions).filter(k=>sessHasData(o.sessions[k])).length;
    openSheet({title:'שחזור מגיבוי',sub:f.name,body:`<p class="muted" style="font-size:15px;margin-top:10px">בקובץ יש <b>${n}</b> אימונים. השחזור יחליף את מה שיש עכשיו בטלפון (<b>${datesDesc().length}</b> אימונים).</p>`,
      foot:'<div class="foot2"><button class="btn line" data-act="close">ביטול</button><button class="btn pri" data-act="doimport">שחזור</button></div>'});
  }catch(e){toast('הקובץ לא נראה כמו גיבוי של האפליקציה')}
});

/* ---------- גיליון ---------- */
const sheetEl=document.getElementById('sheet'),scrim=document.getElementById('scrim');let sheetOpen=false,sheetCb=null;
function openSheet({title,sub,body,foot,onClose}){
  sheetEl.innerHTML=`<div class="sh-top"><div class="grab"></div><div class="sh-head"><h2>${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</h2><button class="sh-close" data-act="close" aria-label="סגירה">${I.x}</button></div></div><div class="sh-body">${body}</div>${foot?`<div class="sh-foot">${foot}</div>`:''}`;
  if(!sheetOpen){history.pushState({sheet:1},'');sheetCb=onClose||null}else if(onClose)sheetCb=onClose;
  sheetOpen=true;sheetEl.classList.add('open');scrim.classList.add('open');
}
function closeSheet(fromPop){
  if(!sheetOpen)return;sheetOpen=false;sheetEl.classList.remove('open');scrim.classList.remove('open');
  const cb=sheetCb;sheetCb=null;
  if(!fromPop&&history.state&&history.state.sheet)goBack(cb);else cb&&cb();
}
(()=>{let y0=null,dy=0;
  sheetEl.addEventListener('touchstart',e=>{const body=sheetEl.querySelector('.sh-body');if(e.target.closest('.sh-top')||(body&&body.scrollTop<=0&&e.target.closest('.sh-body'))){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
  sheetEl.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sheetEl.style.transition='none';sheetEl.style.transform=`translateY(${dy}px)`}},{passive:true});
  sheetEl.addEventListener('touchend',()=>{if(y0==null)return;sheetEl.style.transition='';sheetEl.style.transform='';if(dy>90)closeSheet();y0=null});
})();

/* ---------- טוסט ---------- */
let toastT,toastUndo=null;
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">ביטול</button>':''}`;
  toastUndo=undo||null;t.style.pointerEvents=undo?'auto':'none';t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');t.style.pointerEvents='none';toastUndo=null},undo?6000:2400)}

/* =========================================================
   אירועים
   ========================================================= */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.val;
  switch(act){
    case'tab':if(sheetOpen)closeSheet();if(tab===v&&subs[v]){leaveSub();break}tab=v;render(true);scrollTo(0,0);break;
    case'month':shiftMonth(+v);break;
    case'mnow':calM=today().slice(0,7);calSel=latestIn(calM);render(true);break;
    case'start':startLive();break;
    case'cancel':{const d=today();
      if(sessHasData(sess(d))){openSheet({title:'לבטל את האימון?',body:`<p class="muted" style="font-size:15px;margin-top:10px">כל מה שרשמת באימון הזה (<b>${totalDone(d)}</b> סטים) יימחק.</p>`,
        foot:'<div class="foot2"><button class="btn line" data-act="close">המשך באימון</button><button class="btn badfill" data-act="docancel">ביטול האימון</button></div>'});break}
      doCancel();break}
    case'docancel':closeSheet();setTimeout(doCancel,60);break;
    case'openday':openSub('w',{mode:'view',d:v});break;
    case'selday':calSel=v;render();break;
    case'share-w':openShare(v);break;
    case'doshare':doShareImg();break;
    case'openh':openSub('h',{mode:'view',d:v});break;
    case'back':leaveSub();break;
    case'edit':subs[tab].mode='edit';userCol={};render(true);scrollTo(0,0);break;
    case'editdone':subs[tab].mode='view';render(true);scrollTo(0,0);break;
    case'migok':delete S.migNote;save();render();break;
    case'toggle':{const el=document.getElementById('ex-'+v),on=!el.classList.contains('col');userCol[v]=on;setCol(el,on);break}
    case'jump':{const el=document.getElementById('ex-'+v);if(!el)break;if(el.classList.contains('col')){userCol[v]=false;setCol(el,false)}el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});break}
    case'check':{
      const id=b.dataset.ex,i=+b.dataset.i,e=EX[id],c=arrOf(cur,id)[i],pv=prevSet(id,cur,i);
      if(isDone(c,e))break;
      if(anyV(pv)){
        const el=document.getElementById('ex-'+id),wasComp=el.classList.contains('comp');
        if(!el.classList.contains('col'))userCol[id]=false;
        if(!e.bw&&has(pv.w)&&!(c&&has(c.w)))setVal(cur,id,i,'w',pv.w);
        if(has(pv.r)&&!(c&&has(c.r)))setVal(cur,id,i,'r',pv.r);
        (pv.d||[]).forEach((x,j)=>{const cc=arrOf(cur,id)[i],cd=cc&&cc.d&&cc.d[j];
          if(has(x.w)&&!(cd&&has(cd.w)))setVal(cur,id,i,'w',x.w,j);
          if(has(x.r)&&!(cd&&has(cd.r)))setVal(cur,id,i,'r',x.r,j)});
        if(!S.tipCheck){S.tipCheck=true;save();const tp=document.querySelector('.tip');if(tp)tp.remove()}
        rerenderCard(id);
        const row=document.querySelector(`#ex-${id} .set[data-i="${i}"]:not(.drop):not(.hd)`);
        if(row&&row.classList.contains('done')){haptic();restart(row,'just');startRest(id,i)}
        refresh(id,wasComp);
        if(justDone.has(id))setTimeout(()=>leave(document.getElementById('ex-'+id)),550);
      }else{const row=b.closest('.set'),ins=[...row.querySelectorAll('.in')];(ins.find(x=>!x.value)||ins[0]).focus()}
      break}
    case'adddrop':{
      const id=b.dataset.ex,i=+b.dataset.i,e=EX[id],c=arrOf(cur,id)[i],pv=prevSet(id,cur,i);
      const n=dropCount(cur,e,i,c,pv),st=setOf(cur,id,i);st.d=st.d||[];while(st.d.length<=n)st.d.push({w:null,r:null});save();
      userCol[id]=false;rerenderCard(id);
      const inp=document.querySelector(`#ex-${id} .set.drop[data-i="${i}"][data-j="${n}"] .in`);if(inp)inp.focus();
      break}
    case'rmdrop':{
      const id=b.dataset.ex,i=+b.dataset.i,j=+b.dataset.j,c=arrOf(cur,id)[i];
      if(c&&c.d&&j<c.d.length)c.d.splice(j,1);
      hideGhost.add(cur+'|'+id+'|'+i);save();userCol[id]=false;rerenderCard(id);refresh(id);break}
    case'finish':openFinish();break;
    case'rest-adj':adjRest(+v);break;
    case'rest-stop':stopRest();break;
    case'delsess':{const d=cur,keep=JSON.stringify(S.sessions[d]);delete S.sessions[d];if(S.active&&S.active.d===d)S.active=null;save();leaveSub();
      toast('האימון נמחק',()=>{S.sessions[d]=JSON.parse(keep);save();render();toast('שוחזר')});break}
    case'hseg':hseg=v;render(true);break;
    case'exhist':openExSheet(v);break;
    case'close':closeSheet();break;
    case'undo':if(toastUndo){const u=toastUndo;toastUndo=null;u()}break;
    case'share':doShare();break;
    case'import':document.getElementById('imp').click();break;
    case'doimport':if(pendingImport){S=pendingImport;if(!S.sessions)S.sessions={};pendingImport=null;migrate();save();closeSheet();subs.w=subs.h=null;userCol={};prFired.clear();render(true);toast('הגיבוי שוחזר')}break;
    case'refresh':(async()=>{try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}location.reload()})();break;
  }
});
view.addEventListener('input',ev=>{
  const t=ev.target;if(!t.matches('.in'))return;
  const f=t.dataset.f,raw=t.value,id=t.dataset.ex,i=+t.dataset.i,j=t.dataset.j!=null?+t.dataset.j:null;
  const c=f==='w'?raw.replace(/,/g,'.').replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1').slice(0,6):raw.replace(/\D/g,'').slice(0,3);
  if(c!==raw)t.value=c;
  const n=c===''||c==='.'?null:parseFloat(c),val=Number.isFinite(n)?n:null;
  setVal(cur,id,i,f,val,j);
  t.classList.toggle('has',t.value!=='');
  const box=t.parentElement;
  if(box.classList.contains('wbox')){const e=EX[id],pv=prevSet(id,cur,i),pw=j==null?(pv&&pv.w):(pv&&pv.d&&pv.d[j]&&pv.d[j].w);const sp=box.querySelector('.tot');sp.textContent=totTxt(e,val,pw);sp.classList.toggle('g',val==null)}
  rowUpdate(id,i);refresh(id);
});
view.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||!ev.target.matches('.in'))return;ev.preventDefault();
  const list=[...ev.target.closest('.ex').querySelectorAll('.in')],k=list.indexOf(ev.target);
  if(k<list.length-1)list[k+1].focus();else ev.target.blur();
});
view.addEventListener('focusout',ev=>{const c=ev.target.closest&&ev.target.closest('.ex');if(c)setTimeout(()=>leave(c),150)});
document.addEventListener('focusin',ev=>{if(ev.target.matches('.in')){document.body.classList.add('kb');setTimeout(()=>{try{ev.target.select()}catch(e){}},0)}});
document.addEventListener('focusout',ev=>{if(ev.target.matches('.in'))setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches('.in'))document.body.classList.remove('kb')},80)});
// החלקה בין חודשים
(()=>{let t0=null;
  view.addEventListener('touchstart',e=>{t0=(tab==='h'&&hseg==='s'&&!subs.h&&!sheetOpen&&e.touches.length===1)?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
  view.addEventListener('touchend',e=>{if(!t0)return;const p=e.changedTouches[0],dx=p.clientX-t0.x,dy=p.clientY-t0.y;t0=null;
    if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.8)shiftMonth(dx>0?1:-1)},{passive:true});
})();
// שעון האימון
setInterval(()=>{if(document.hidden)return;const ck=document.getElementById('clock');if(ck){ck.textContent=clockTxt();const cd=document.getElementById('cdate');if(cd)cd.textContent=longDate()}
  const a=S.active;if(!a)return;const t=durTxt(Date.now()-a.t0);for(const id of ['timer','ctimer']){const el=document.getElementById(id);if(el)el.textContent=t}},1000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S.rest){if(S.rest.end<=Date.now()-3000)stopRest();else showRest()}
  if(document.hidden||sheetOpen||document.body.classList.contains('kb'))return;
  endStale();
  const sub=subs[tab];
  if(sub&&sub.mode==='live'&&!S.active){subs[tab]=null;render(true);return}
  if(!sub||sub.mode==='view'){if(!sub)calM=calM||today().slice(0,7);render()}
});
{const q=new URLSearchParams(location.search).get('tab');if(['w','h','b'].includes(q))tab=q}
if(!/\/next\//.test(location.pathname)&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

// אימון פעיל → נפתחים ישר בתוכו (חזרה אחורה = לוח השנה)
if(S.active&&S.active.d===today()&&tab==='w'){subs.w={mode:'live',d:today()};history.pushState({sub:1},'')}
if(S.rest){if(S.rest.end>Date.now()-3000)showRest();else{S.rest=null;save()}}
render(true);
if(subs.w&&totalDone(today())>0){const nx=firstOpen(today());if(nx)requestAnimationFrame(()=>{const el=document.getElementById('ex-'+nx.id);el&&el.scrollIntoView({block:'start'})})}
}
